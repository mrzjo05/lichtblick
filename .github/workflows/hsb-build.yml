# Build the Windows and macOS packages of this patched build (unsigned), the same way the upstream
# Pre-Build workflow does on one macOS runner. The upstream workflows are removed on this branch so
# that pushing it or publishing a release here does not trigger them.
name: hsb build (Windows, macOS)

on:
  push:
    branches:
      - "hsb/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Read version from package.json
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Build prod files
        run: yarn run desktop:build:prod

      - name: Build Windows version
        run: yarn run package:win

      - name: Build macOS version
        run: yarn run package:darwin
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: lichtblick-${{ env.version }}-windows
          path: dist/lichtblick-${{ env.version }}-win.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: lichtblick-${{ env.version }}-macos
          path: dist/lichtblick-${{ env.version }}-mac-universal.dmg
          if-no-files-found: error
          retention-days: 30
